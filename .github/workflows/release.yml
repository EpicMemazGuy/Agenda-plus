name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Versietag (bijv. v0.1.5-pre-alpha of v0.1.5)'
        required: false
        default: 'v0.1.4-pre-alpha'
      app_name:
        description: 'App-naam in Android & Release (standaard: Agenda+)'
        required: false
        default: 'Agenda+'
      release_name:
        description: 'Optionele naam voor de Release & APK (leeg = App-naam + Versietag)'
        required: false
        default: ''
      version_code:
        description: 'Optionele numerieke versionCode (leeg = automatisch oplopend uit versietag)'
        required: false
        default: ''
      new_features:
        description: 'New Features (typ nieuwe functies; scheid met ; of | of nieuwe regel)'
        required: false
        default: ''
      release_notes:
        description: 'Optionele korte toelichting bovenaan deze release'
        required: false
        default: ''
      is_prerelease:
        description: 'Upload als Pre-Release (vink aan voor pre-release, uit voor stabiel)'
        required: false
        type: boolean
        default: true


permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve Version, App Name & Release Notes
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          INPUT_APP_NAME: ${{ github.event.inputs.app_name }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_NEW_FEATURES: ${{ github.event.inputs.new_features }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IS_PRERELEASE: ${{ github.event.inputs.is_prerelease }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request
          import xml.sax.saxutils as saxutils

          raw_tag = (os.environ.get("INPUT_TAG") or "").strip()
          if not raw_tag:
              ref_name = (os.environ.get("REF_NAME") or "").strip()
              raw_tag = ref_name if ref_name and ref_name != "main" else "v0.1.4-pre-alpha"

          app_name = (os.environ.get("INPUT_APP_NAME") or "").strip() or "Agenda+"
          release_name = (os.environ.get("INPUT_RELEASE_NAME") or "").strip() or f"{app_name} {raw_tag}"
          version_name = re.sub(r"^[vV]+", "", raw_tag).strip() or "0.1.4-pre-alpha"

          # Monotone versionCode berekening:
          # Houdt >= 10410 aan zodat elke build altijd hoger ligt dan oudere builds (1041..1049)
          # en neemt zowel sub-nummers (bijv. -pre-alpha.2) als bestaande GitHub releases mee.
          manual_vc = (os.environ.get("INPUT_VERSION_CODE") or "").strip()
          if manual_vc.isdigit() and int(manual_vc) > 0:
              version_code = int(manual_vc)
          else:
              lower = version_name.lower().split("+")[0]
              core = lower.split("-")[0]
              pre = lower.split("-", 1)[1] if "-" in lower else ""
              nums = [int(re.sub(r"\D", "", p) or "0") for p in core.split(".")]
              major = nums[0] if len(nums) > 0 else 0
              minor = nums[1] if len(nums) > 1 else 0
              patch = nums[2] if len(nums) > 2 else 0
              extra = nums[3] if len(nums) > 3 else 0
              if not pre:
                  stage = 9
                  pre_num = min(extra, 9)
              else:
                  if "pre-alpha" in pre or "prealpha" in pre:
                      stage = 1
                  elif "alpha" in pre:
                      stage = 2
                  elif "beta" in pre:
                      stage = 3
                  elif "rc" in pre:
                      stage = 4
                  else:
                      stage = 0
                  m_pre = re.search(r"(\d+)\s*$", pre)
                  pre_num = min(int(m_pre.group(1)), 9) if m_pre else 0

              version_code = max(
                  10410,
                  major * 1_000_000 + minor * 10_000 + patch * 100 + stage * 10 + pre_num,
              )

              # Controleer hoogste bestaande buildnummer in gepubliceerde GitHub Releases om downgrade te voorkomen
              repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
              token = os.environ.get("GITHUB_TOKEN", "").strip()
              if repo and token:
                  try:
                      req = urllib.request.Request(
                          f"https://api.github.com/repos/{repo}/releases?per_page=30",
                          headers={
                              "Accept": "application/vnd.github+json",
                              "Authorization": f"Bearer {token}",
                              "User-Agent": "AgendaPlus-Release-Builder",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=8) as resp:
                          releases = json.loads(resp.read().decode("utf-8"))
                      max_existing_code = 0
                      for rel in releases:
                          if rel.get("draft") or rel.get("tag_name") == "internal-signing-keystore":
                              continue
                          body_text = rel.get("body") or ""
                          for m in re.finditer(r"build\s*`?(\d+)`?", body_text, re.IGNORECASE):
                              max_existing_code = max(max_existing_code, int(m.group(1)))
                      if version_code <= max_existing_code:
                          version_code = max_existing_code + 1
                  except Exception as exc:
                      print(f"Waarschuwing: kon eerdere releases niet ophalen voor versionCode-check: {exc}")

          def slugify(text: str) -> str:
              s = text.replace("+", "Plus")
              s = re.sub(r"[^A-Za-z0-9._-]+", "-", s)
              s = re.sub(r"-{2,}", "-", s).strip("-")
              return s or "AgendaPlus"

          apk_base = slugify(release_name)
          if raw_tag not in release_name and version_name not in release_name:
              apk_base = f"{apk_base}-{slugify(raw_tag)}"
          apk_filename = f"{apk_base}.apk"

          # Pas app_name in strings.xml aan als een andere naam is gekozen
          strings_path = "app/src/main/res/values/strings.xml"
          with open(strings_path, "r", encoding="utf-8") as f:
              xml_content = f.read()
          escaped_name = saxutils.escape(app_name)
          updated_xml, count = re.subn(
              r'(<string\s+name="app_name">)([^<]*)(</string>)',
              lambda m: f"{m.group(1)}{escaped_name}{m.group(3)}",
              xml_content,
              count=1,
          )
          if count == 1 and updated_xml != xml_content:
              with open(strings_path, "w", encoding="utf-8") as f:
                  f.write(updated_xml)
              print(f"Updated strings.xml app_name -> {app_name}")

          # Parse getypte "New Features" voor de release notes
          raw_features = (os.environ.get("INPUT_NEW_FEATURES") or "").strip()
          feature_items = []
          if raw_features:
              lines = [ln.strip() for ln in re.split(r"\r?\n", raw_features) if ln.strip()]
              if len(lines) == 1 and (";" in lines[0] or "|" in lines[0]):
                  sep = ";" if ";" in lines[0] else "|"
                  lines = [part.strip() for part in lines[0].split(sep) if part.strip()]
              for item in lines:
                  cleaned = re.sub(r"^[-*•]\s+", "", item).strip()
                  if cleaned:
                      feature_items.append(cleaned)
          else:
              # Automatische fallback bij tag-push: recente commits sinds de vorige tag
              try:
                  prev_tag = subprocess.check_output(
                      ["git", "describe", "--tags", "--abbrev=0", f"{raw_tag}^"],
                      stderr=subprocess.DEVNULL,
                      text=True,
                  ).strip()
                  log_range = f"{prev_tag}..HEAD"
              except Exception:
                  log_range = "-n 5"
              try:
                  cmd = ["git", "log", "--no-merges", "--pretty=format:%s"]
                  if log_range == "-n 5":
                      cmd.extend(["-n", "5"])
                  else:
                      cmd.append(log_range)
                  commits = subprocess.check_output(cmd, text=True).splitlines()
                  feature_items = [c.strip() for c in commits if c.strip()][:8]
              except Exception:
                  feature_items = []

          if not feature_items:
              feature_items = ["Algemene verbeteringen en stabiliteitsfixes."]

          raw_notes = (os.environ.get("INPUT_RELEASE_NOTES") or "").strip()
          body_lines = [f"### {release_name}", ""]
          if raw_notes:
              body_lines.extend([raw_notes, ""])
          body_lines.extend([
              f"- **App-naam:** `{app_name}`",
              f"- **Versie:** `v{version_name}` (build `{version_code}`)",
              "- **Package ID:** `nl.agendaplus.axola`",
              f"- **Bestand:** `{apk_filename}`",
              "",
              "---",
              "",
              f"#### Wat is er nieuw in {app_name}?",
          ])
          for feat in feature_items:
              body_lines.append(f"- {feat}")
          body_lines.extend([
              "",
              "---",
              "",
              "#### Installatie & Updaten op Android:",
              f"1. Open het gedownloade bestand `{apk_filename}` (of update direct in {app_name}).",
              "2. Kies **Updaten** om je gegevens, login en instellingen te behouden.",
              "3. Geef indien gevraagd eenmalig toestemming voor *Installeren uit onbekende bron*.",
              "",
          ])

          with open(".release_body.md", "w", encoding="utf-8") as f:
              f.write("\n".join(body_lines))

          gh_env = os.environ["GITHUB_ENV"]
          with open(gh_env, "a", encoding="utf-8") as f:
              f.write(f"RELEASE_TAG={raw_tag}\n")
              f.write(f"APP_NAME={app_name}\n")
              f.write(f"RELEASE_TITLE={release_name}\n")
              f.write(f"APP_VERSION_NAME={version_name}\n")
              f.write(f"APP_VERSION_CODE={version_code}\n")
              f.write(f"APK_FILENAME={apk_filename}\n")

          print(f"Resolved RELEASE_TAG={raw_tag}")
          print(f"Resolved APP_NAME={app_name}")
          print(f"Resolved RELEASE_TITLE={release_name}")
          print(f"Resolved APP_VERSION_NAME={version_name}")
          print(f"Resolved APP_VERSION_CODE={version_code}")
          print(f"Resolved APK_FILENAME={apk_filename}")
          print("New Features count:", len(feature_items))
          PY

      - name: Restore & Verify Persistent Signing Keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SECRET_DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "=== Keystore Verificatie ==="
          KEYSTORE_SOURCE=""

          if [ -n "${SECRET_DEBUG_KEYSTORE_B64:-}" ]; then
            echo "Keystore laden uit GitHub Secret (DEBUG_KEYSTORE_BASE64)..."
            printf '%s' "$SECRET_DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > debug.keystore
            KEYSTORE_SOURCE="GitHub Secret"
          elif [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            echo "debug.keystore herstellen uit debug.keystore.base64 in repository..."
            if ! base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            fi
            KEYSTORE_SOURCE="Repository debug.keystore.base64"
          else
            echo "debug.keystore.base64 niet aanwezig in checkout; persistente CI-keystore controleren via GitHub API..."
            ASSET_URL=$(python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "AgendaPlus-Release-Builder",
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              releases = json.loads(resp.read().decode("utf-8"))

          found_url = ""
          for rel in releases:
              if rel.get("tag_name") == "internal-signing-keystore" or rel.get("name") == "Internal CI Signing Keystore":
                  for asset in rel.get("assets") or []:
                      if asset.get("name") == "signing.keystore":
                          found_url = asset.get("url") or ""
                          break
                  if found_url:
                      break
          print(found_url)
          PY
          )

            if [ -n "$ASSET_URL" ]; then
              echo "Bestaande persistente CI-keystore ophalen uit internal-signing-keystore..."
              curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                "$ASSET_URL" \
                -o debug.keystore
              KEYSTORE_SOURCE="Persistente draft release (internal-signing-keystore)"
            else
              echo "Nog geen persistente CI-keystore gevonden. Eenmalig genereren en opslaan in internal-signing-keystore..."
              rm -f debug.keystore
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=AgendaPlus,O=Axola,C=NL"

              python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "AgendaPlus-Release-Builder",
          }

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              releases = json.loads(resp.read().decode("utf-8"))

          target = None
          for rel in releases:
              if rel.get("tag_name") == "internal-signing-keystore" or rel.get("name") == "Internal CI Signing Keystore":
                  target = rel
                  break

          if target is None:
              payload = json.dumps({
                  "tag_name": "internal-signing-keystore",
                  "name": "Internal CI Signing Keystore",
                  "body": "Automatisch opgeslagen ondertekensleutel zodat toekomstige APK-updates altijd compatibel blijven zonder dataverlies.",
                  "draft": True,
                  "prerelease": False,
              }).encode("utf-8")
              create_req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases",
                  data=payload,
                  method="POST",
                  headers={**headers, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(create_req, timeout=15) as cr:
                  target = json.loads(cr.read().decode("utf-8"))

          upload_url = (target.get("upload_url") or "").split("{")[0]
          if not upload_url:
              raise RuntimeError("Kon upload_url voor internal-signing-keystore niet ophalen.")

          with open("debug.keystore", "rb") as kf:
              ks_bytes = kf.read()

          up_req = urllib.request.Request(
              f"{upload_url}?name=signing.keystore",
              data=ks_bytes,
              method="POST",
              headers={
                  **headers,
                  "Content-Type": "application/octet-stream",
              },
          )
          with urllib.request.urlopen(up_req, timeout=20) as ur:
              ur.read()
          print("Persistente signing.keystore succesvol opgeslagen in draft release.")
          PY
              KEYSTORE_SOURCE="Nieuwe persistente draft release (internal-signing-keystore)"
            fi
          fi

          if [ ! -s debug.keystore ]; then
            echo "Fout: kon geen geldige debug.keystore voorbereiden."
            exit 1
          fi

          CERT_INFO=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey)
          echo "$CERT_INFO" | grep -E "Alias name:|SHA1:|SHA256:"
          KEYSTORE_SHA256=$(echo "$CERT_INFO" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$KEYSTORE_SHA256" ]; then
            echo "Fout: kon SHA-256 vingerafdruk van debug.keystore niet uitlezen."
            exit 1
          fi
          echo "KEYSTORE_SHA256=$KEYSTORE_SHA256" >> "$GITHUB_ENV"
          echo "=== Keystore gereed via: $KEYSTORE_SOURCE (SHA256=$KEYSTORE_SHA256) ==="

      - name: Build Consistently Signed Android APK
        run: |
          set -euo pipefail
          ./gradlew assembleDebug \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE" \
            --stacktrace

          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Fout: APK niet gevonden op $APK_SRC"
            exit 1
          fi

          DEST_DIR="app/build/outputs/apk"
          mkdir -p "$DEST_DIR"
          FINAL_APK="$DEST_DIR/$APK_FILENAME"
          cp "$APK_SRC" "$FINAL_APK"
          echo "FINAL_APK_PATH=$FINAL_APK" >> $GITHUB_ENV
          echo "Gereed! APK opgeslagen als $FINAL_APK"

      - name: Verify APK Signature & Embedded Version Metadata
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          echo "Build tools: $BUILD_TOOLS_DIR"
          if [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            SIGN_OUT=$("$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$FINAL_APK_PATH")
            echo "$SIGN_OUT"
            if ! echo "$SIGN_OUT" | tr -d ':' | grep -qi "$KEYSTORE_SHA256"; then
              echo "Fout: APK-handtekening komt niet overeen met de gekozen keystore ($KEYSTORE_SHA256)!"
              exit 1
            fi
          fi
          if [ -x "$BUILD_TOOLS_DIR/aapt2" ]; then
            BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging "$FINAL_APK_PATH")
            echo "$BADGING" | grep -E "^(package:|application-label)"
            if ! echo "$BADGING" | grep -q "name='nl.agendaplus.axola'"; then
              echo "Fout: package name wijkt af van nl.agendaplus.axola"
              exit 1
            fi
            if ! echo "$BADGING" | grep -q "versionName='$APP_VERSION_NAME'"; then
              echo "Fout: ingebouwde versionName komt niet overeen met '$APP_VERSION_NAME'"
              exit 1
            fi
            if ! echo "$BADGING" | grep -q "versionCode='$APP_VERSION_CODE'"; then
              echo "Fout: ingebouwde versionCode komt niet overeen met '$APP_VERSION_CODE'"
              exit 1
            fi
          fi

      - name: Upload APK als GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILENAME }}
          path: ${{ env.FINAL_APK_PATH }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: .release_body.md
          files: ${{ env.FINAL_APK_PATH }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
