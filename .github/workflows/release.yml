name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Versie tag (bijv. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_notes:
        description: 'Optionele opmerkingen bij deze release'
        required: false
        default: 'Nieuwste automatische APK-build van Agenda+.'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore successfully restored."
          else
            echo "debug.keystore.base64 not found, proceeding with local build environment."
          fi

      - name: Build Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Bepaal het tag-/versielabel
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          # Controleer of de gebruiker release signing secrets heeft ingesteld
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release keystore secrets gevonden. Release APK bouwen..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
            ./gradlew assembleRelease --stacktrace
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
          else
            echo "Geen release signing secrets gevonden. Direct installeerbare Debug APK bouwen..."
            ./gradlew assembleDebug --stacktrace
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -f "$APK_SRC" ]; then
            echo "Fout: APK niet gevonden op $APK_SRC"
            exit 1
          fi

          DEST_DIR="app/build/outputs/apk"
          mkdir -p "$DEST_DIR"
          FINAL_APK="$DEST_DIR/AgendaPlus-${TAG}.apk"
          cp "$APK_SRC" "$FINAL_APK"
          echo "FINAL_APK_PATH=$FINAL_APK" >> $GITHUB_ENV
          echo "Gereed! APK opgeslagen als $FINAL_APK"

      - name: Upload APK als GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgendaPlus-${{ env.RELEASE_TAG }}-APK
          path: ${{ env.FINAL_APK_PATH }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Agenda+ ${{ env.RELEASE_TAG }}"
          body: |
            ### Agenda+ ${{ env.RELEASE_TAG }} 📱✨

            ${{ github.event.inputs.release_notes || 'Automatisch gebouwde APK-release via GitHub Actions.' }}

            ---

            #### 🚀 Wat is er nieuw in Agenda+?
            - **10x Sneller dan Magister**: Direct toegang tot je rooster, cijfers en huiswerk zonder laadtijden.
            - **Twee Thema’s**: Volledig Nothing OS-thema (OLED zwart, dot-matrix, rode accenten) en modern Standaard Material You-thema.
            - **Live OV Buskaart**: Realtime bustijden en vertragingen van jouw buslijnen via OVapi data.
            - **What-If Cijfercalculator**: Bereken exact welk cijfer je nodig hebt om je gemiddelde te behalen.
            - **Interactieve Home Screen Widgets**: 3 Android widgets (Volgende Les, Gemiddelde, Huiswerk).
            - **100% Offline-modus**: Werkt ook in schoolkelders zonder wifi of bereik.

            ---

            #### 📲 Installatie op je Android telefoon:
            1. Download het bestand `AgendaPlus-${{ env.RELEASE_TAG }}.apk` hieronder op je telefoon.
            2. Tik op het bestand om te openen.
            3. Geef toestemming voor *Installeren uit onbekende bron* (indien je telefoon hierom vraagt).
            4. Start **Agenda+** en log direct in via je school!
          files: ${{ env.FINAL_APK_PATH }}
          draft: false
          prerelease: false
